# Builds every pull request and deploys it to a temporary Firebase Hosting
# preview channel. The preview URL is posted as a comment on the PR and
# expires after 7 days.
name: Preview on Firebase Hosting

on:
  pull_request:

concurrency:
  group: firebase-hosting-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  preview:
    # Pull requests from forks have no access to the deploy secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Build-time config comes from the repo's Actions variables (names as in
      # .env.example). Only variables that are set are exported, so unset ones
      # fall back to the defaults in lib/ instead of becoming empty strings.
      - name: Build
        env:
          VARS: ${{ toJSON(vars) }}
        run: |
          eval "$(jq -r 'to_entries[] | select(.key | startswith("NEXT_PUBLIC_")) | select(.value != "") | "export \(.key)=\(.value | @sh)"' <<<"$VARS")"
          npm run build
      - run: npm run typecheck

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KATHYKAO_PERSONAL_WEBSITE }}
          projectId: kathykao-personal-website
          expires: 7d
