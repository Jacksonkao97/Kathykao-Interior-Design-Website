# Pages CMS (https://pagescms.org) setup for editing projects, site settings
# and the About page in the browser.
# Saving commits to `main`, which rebuilds and deploys the site. The
# loaders in lib/projects.ts, lib/site.ts and lib/experience.ts check these
# files at build time.

media:
  name: projects
  label: Project photos
  input: public/images/projects
  output: /images/projects
  rename: safe
  extensions: [jpg, jpeg, png, webp]

settings:
  content:
    # Keep keys the editor doesn't show, such as each project's plan palette.
    merge: true
  commit:
    identity: user

content:
  - name: projects
    label: Projects
    type: collection
    path: content/projects
    format: json
    filename:
      template: "{primary}.json"
      field: create
    view:
      fields: [title, category, location, year]
      primary: title
      sort: [year, title]
      search: [title, location]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Project name
        type: string
        required: true
      - name: category
        label: Category
        type: select
        required: true
        options:
          values: [Residential, Hospitality, Commercial]
      - name: location
        label: Location
        type: string
        required: true
        description: City, e.g. Hong Kong.
      - name: year
        label: Year completed
        type: number
        required: true
        options:
          min: 1990
          max: 2100
      - name: area
        label: Floor area
        type: string
        required: true
        description: With units, e.g. 110 m².
      - name: scope
        label: Scope of work
        type: string
        list: true
        description: One item per line, e.g. Space planning, Joinery design.
      - name: summary
        label: Summary
        type: text
        required: true
        description: One or two sentences. Shown on project cards and in Google results.
        options:
          maxlength: 300
      - name: story
        label: Story
        type: text
        list: true
        description: The write-up on the project page, one paragraph per item.
      - name: cover
        label: Cover photo
        type: image
        description: Landscape works best. Shown on cards and at the top of the project page.
      - name: coverAlt
        label: Cover photo description
        type: string
        description: What the cover shows, for search engines and screen readers, e.g. Oak kitchen island under two pendant lamps.
      - name: gallery
        label: Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{alt}"
        description: Photos further down the project page, shown two tall then one wide.
        fields:
          - name: image
            label: Photo
            type: image
            required: true
          - name: alt
            label: Photo description
            type: string
            required: true
            description: What the photo shows, e.g. Linen curtains drawn back from a wide window.
      - name: order
        label: Order within the year
        type: number
        description: Optional. Projects are listed newest year first; use 1, 2, 3 to order projects from the same year.
        options:
          min: 0

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: email
        label: Email
        type: string
        required: true
        pattern:
          regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          message: Enter an email address, e.g. hello@kathykao.design
      - name: whatsappNumber
        label: WhatsApp number
        type: string
        required: true
        description: The contact form sends enquiries here. Country code first, digits only, no + or spaces, e.g. 85291234567.
        pattern:
          regex: "^[1-9][0-9]{6,14}$"
          message: Digits only, starting with the country code, e.g. 85291234567
      - name: city
        label: Home city
        type: string
        required: true
      - name: countryCode
        label: Country code
        type: string
        required: true
        description: Two capital letters, e.g. HK. Used by search engines.
        pattern:
          regex: "^[A-Z]{2}$"
          message: Two capital letters, e.g. HK
      - name: otherAreas
        label: Other places you work
        type: string
        list: true
        description: Shown in the footer as "working across …".
      - name: social
        label: Social links
        type: object
        list: true
        description: Shown in the footer in this order. Remove a row to hide it.
        fields:
          - name: platform
            label: Platform
            type: select
            required: true
            options:
              values: [Instagram, LinkedIn, Pinterest, Facebook, Xiaohongshu, Houzz, YouTube, Behance]
          - name: url
            label: Link
            type: string
            required: true
            pattern:
              regex: "^https://"
              message: Paste the full link, starting with https://

  - name: about
    label: About page
    type: file
    path: content/about.json
    format: json
    fields:
      - name: headline
        label: Headline
        type: string
        required: true
        description: The large title at the top of the page.
      - name: intro
        label: Intro
        type: text
        required: true
        description: One or two sentences under the headline. Also shown in Google results.
        options:
          maxlength: 300
      - name: bio
        label: About Kathy
        type: text
        list: true
        description: Optional. A longer introduction, one paragraph per item.
      - name: experience
        label: Experience
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{role}, {company}"
        description: Newest first. Drag to reorder.
        fields:
          - name: role
            label: Role
            type: string
            required: true
          - name: company
            label: Company
            type: string
            required: true
          - name: location
            label: Location
            type: string
          - name: period
            label: Dates
            type: string
            required: true
            description: e.g. 2021 — Present
          - name: points
            label: What you did
            type: text
            list: true
            description: One point per item.
      - name: education
        label: Education
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{qualification}"
        fields:
          - name: qualification
            label: Qualification
            type: string
            required: true
          - name: school
            label: School
            type: string
            required: true
          - name: period
            label: Dates
            type: string
            description: e.g. 2010 — 2014
      - name: skills
        label: Skills
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{group}"
        description: Groups shown down the side, e.g. Design, Software. The first group is also given to search engines as your main skills.
        fields:
          - name: group
            label: Group name
            type: string
            required: true
          - name: items
            label: Skills
            type: string
            list: true
      - name: recognition
        label: Awards and press
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: year
            label: Year
            type: number
            options:
              min: 1990
              max: 2100
